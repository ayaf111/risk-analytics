name: Run Notebook

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: 3.11

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Install Jupyter and register kernel
      run: |
        pip install notebook ipykernel
        python -m ipykernel install --name python3 --user

    - name: Run notebook
      run: |
        jupyter nbconvert --to notebook --execute notebooks/_init_.ipynb --output executed_notebook.ipynb
